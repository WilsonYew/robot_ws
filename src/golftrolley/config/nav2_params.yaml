# golftrolley/config/nav2_params.yaml
bt_navigator:
  ros__parameters:
    use_sim_time: false
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"


controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    odom_topic: /diff_cont/odom     # <-- switch to /odometry/filtered if you use EKF later
    min_x_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
      stateful: true
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: 0.0
      max_vel_x: 0.8
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 1.4
      min_speed_xy: 0.0
      max_speed_xy: 0.8
      acc_lim_x: 0.8
      decel_lim_x: -0.8
      acc_lim_theta: 1.5
      decel_lim_theta: -1.5
      vx_samples: 12
      vtheta_samples: 20
      sim_time: 1.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      ObstacleFootprint.scale:  0.02
      PathAlign.scale:          32.0
      GoalAlign.scale:          24.0
      PathDist.scale:           32.0
      GoalDist.scale:           24.0
      RotateToGoal.scale:       32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: 0.8

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"  
      tolerance: 0.5
      use_astar: false

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["SimpleSmoother"]
    SimpleSmoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0
      max_its: 100
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    behaviors: ["spin", "backup", "drive_on_heading", "wait"]

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"

    wait:
      plugin: "nav2_behaviors::Wait"

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    plugin_lib_names: ["nav2_waypoint_follower::WaypointFollower"]

# -------------------------
# COSTMAPS (global + local)
# -------------------------
# Common footprint/radius; choose one style
# footprint: [[0.25, 0.20], [0.25, -0.20], [-0.25, -0.20], [-0.25, 0.20]]
robot_state_publisher:
  ros__parameters:
    use_tf_static: true

global_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link   # or base_footprint if you prefer
    robot_radius: 0.25            # used if footprint not set
    footprint_padding: 0.02
    resolution: 0.05
    track_unknown_space: true
    update_frequency: 2.0
    publish_frequency: 1.0
    transform_tolerance: 0.3
    rolling_window: false
    plugins: ["static_layer", "inflation_layer"]
    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"
      map_subscribe_transient_local: true   # good with SLAM Toolbox /map
      subscribe_to_updates: true
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.60
      cost_scaling_factor: 3.0

local_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    robot_radius: 0.25
    footprint_padding: 0.02
    rolling_window: true
    width: 6.0
    height: 6.0
    resolution: 0.05
    update_frequency: 8.0
    publish_frequency: 4.0
    transform_tolerance: 0.2
    plugins: ["voxel_layer", "inflation_layer"]

    voxel_layer:
      plugin: "nav2_costmap_2d::VoxelLayer"
      origin_z: 0.0
      max_obstacle_height: 2.0
      z_voxels: 8                 # Pi-friendly; raise if you have CPU headroom
      z_resolution: 0.25
      unknown_threshold: 0
      mark_threshold: 0
      combination_method: 1
      publish_voxel_map: false
      decay_model: 0              # 0: persistent, 1: exponential, 2: linear
      voxel_decay: 0.0            # >0 to forget obstacles over time
      observation_sources: lidar pc

      lidar:
        data_type: LaserScan
        topic: /scan
        clearing: true
        marking: true
        obstacle_range: 8.0
        raytrace_range: 9.0
        min_obstacle_height: 0.00
        max_obstacle_height: 1.20
        expected_update_rate: 0.0
        observation_persistence: 0.0

      pc:
        data_type: PointCloud2
        topic: /stereo/points     # <-- set to your actual PointCloud2 topic
        clearing: true
        marking: true
        obstacle_range: 6.0
        raytrace_range: 7.0
        min_obstacle_height: 0.00
        max_obstacle_height: 2.00
        expected_update_rate: 0.0
        observation_persistence: 0.0
        filter: true
        voxel_filter: true

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.50
      cost_scaling_factor: 3.0

# -------------------------
# Lifecycle (autostart)
# -------------------------
lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - smoother_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
