# ~/robot_ws/src/golftrolley/config/collision_monitor.yaml
collision_monitor:
  ros__parameters:
    # Frames / TF
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    transform_tolerance: 0.5

    # Cmd topics
    cmd_vel_in_topic: "/cmd_vel_muxed"
    cmd_vel_out_topic: "/cmd_vel_collision"
    stop_pub_timeout: 2.0
    enable_stamped_cmd_vel: false
    base_shift_correction: true

    # State / viz (optional)
    state_topic: "collision_monitor_state"

    # -------- SOURCES --------
    # A single LiDAR scan is fine; it contains side returns already.
    observation_sources: ["front_scan"]
    front_scan:
      type: "scan"
      topic: "/scan"           # your LiDAR topic
      source_timeout: 0.8
      min_range: 0.20
      max_range: 8.0
      enabled: true

    # -------- POLYGONS --------
    # Coordinates are in meters in base_link (x forward, y left).
    polygons: ["SlowZoneFront", "StopZoneFront",
               "StopZoneLeft", "StopZoneRight",
               ]  # remove if you don't want rear stops "StopZoneRear"

    # FRONT (keep your originals/tune as needed)
    SlowZoneFront:
      type: "polygon"
      action_type: "limit"
      linear_limit: 0.25
      angular_limit: 0.8
      points: "[[0.25, -0.30], [0.25, 0.30], [1.20, 0.40], [1.20, -0.40]]"
      min_points: 4
      visualize: true
      polygon_pub_topic: "polygon_slow_front"

    StopZoneFront:
      type: "polygon"
      action_type: "stop"
      points: "[[0.35, -0.20], [0.35, 0.20], [1.00, 0.25], [1.00, -0.25]]"
      min_points: 4
      visualize: true
      polygon_pub_topic: "polygon_stop_front"

    # LEFT SIDE STOP (y > 0). Make this hug the robot’s left side.
    # Example assumes ~0.5 m robot width; tweak y-limits to match your chassis.
    StopZoneLeft:
      type: "polygon"
      action_type: "stop"
      points: "[[-0.10, 0.18], [0.90, 0.18], [0.90, 0.55], [-0.10, 0.55]]"
      min_points: 4
      visualize: true
      polygon_pub_topic: "polygon_stop_left"

    # RIGHT SIDE STOP (y < 0), mirrored
    StopZoneRight:
      type: "polygon"
      action_type: "stop"
      points: "[[-0.10, -0.18], [0.90, -0.18], [0.90, -0.55], [-0.10, -0.55]]"
      min_points: 4
      visualize: true
      polygon_pub_topic: "polygon_stop_right"

    # OPTIONAL REAR STOP (protects backing up)
    # StopZoneRear:
    #   type: "polygon"
    #   action_type: "stop"
    #   points: "[[-0.60, -0.35], [-0.60, 0.35], [-0.10, 0.35], [-0.10, -0.35]]"
    #   min_points: 4
    #   visualize: true
    #   polygon_pub_topic: "polygon_stop_rear"