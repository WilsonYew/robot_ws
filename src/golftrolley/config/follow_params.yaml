mono_lidar_follower:
  ros__parameters:
    det_topic: /yolo/detections
    camera_info_topic: /left/camera_info
    cmd_vel_out: /cmd_vel_tracker

    fx_override_px: 470.6
    cx_override_px: 160.1
    img_width_override: 320
    target_class_name: person
    min_score: 0.25

    # Angular
    k_angular: 0.6
    deadband_th_deg: 1.0
    w_min: 0.15
    w_max: 2.0

    # Linear
    target_box_height_px: 260.0
    k_linear: 0.01
    deadband_px: 20.0
    v_min: 0.10
    v_max: 0.45
    forward_only: true

    # Forward force floor
    force_forward_when_seen: true
    px_err_min_for_force: 3.0
    v_force_min: 0.15

    # Robustness
    det_timeout_sec: 3.5
    hold_on_stale: true
    hold_max_sec: 2.5
    hold_decay_lin: 0.99
    hold_decay_ang: 0.85

    # Align-first
    align_first: true
    align_enter_deg: 6.0
    align_exit_deg: 2.0
    align_max_w: 1.2
    align_timeout_sec: 2.0



